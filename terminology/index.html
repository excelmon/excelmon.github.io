<title>terminology.db</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b08;
    --bg-panel: #0d1611;
    --bg-inset: #081209;
    --green: #4ffb86;
    --green-bright: #a8ffc4;
    --green-dim: #2b8f52;
    --green-faint: #1c5c37;
    --amber: #ffb454;
    --text-muted: #6f9a80;
    --border: #1f4a30;
    --danger: #ff6b6b;

    --window-bg: var(--bg-panel);
    --title-bg: #0a130d;
    --title-border: var(--border);
    --window-radius: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    color: var(--green);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      max(32px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(32px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  /* ---------- CRT wrapper ---------- */
  .crt {
    position: relative;
    width: 100%;
    max-width: 720px;
  }

  .crt::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 5;
    border-radius: 8px;
  }

  .terminal-window {
    position: relative;
    background: var(--window-bg);
    border: 1px solid var(--border);
    border-radius: var(--window-radius);
    box-shadow:
      0 0 0 1px rgba(79, 251, 134, 0.05),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 40px rgba(79, 251, 134, 0.06);
    overflow: hidden;
    animation: flicker 6s infinite steps(1);
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: 0.94; }
    98% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .terminal-window { animation: none; }
  }

  /* ---------- title bar ---------- */
  .title-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--title-bg);
    border-bottom: 1px solid var(--title-border);
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green-faint); }
  .dot.amber { background: var(--amber); opacity: 0.85; }
  .dot.red { background: var(--danger); opacity: 0.7; }

  .close-site {
    cursor: pointer;
    text-decoration: none;
  }

  .dot.red.close-site:hover {
    opacity: 1;
    box-shadow: 0 0 8px rgba(255, 107, 107, 0.45);
  }

  .title-bar span.name {
    margin-left: 8px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* ---------- theme toggle ---------- */
  .theme-toggle {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 7px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .theme-toggle:hover {
    border-color: var(--green-dim);
    color: var(--green-bright);
    background: rgba(79, 251, 134, 0.05);
  }

  .theme-toggle .theme-icon { font-size: 11px; }

  /* ---------- Windows theme ---------- */
  .terminal-window.windows-theme {
    --bg-panel: #111111;
    --bg-inset: #050505;
    --green: #c7f0d0;
    --green-bright: #f2fff5;
    --green-dim: #8aaa93;
    --green-faint: #4c5d51;
    --amber: #d8a84e;
    --text-muted: #9aa39d;
    --border: #343434;
    --window-bg: #111111;
    --title-bg: #202020;
    --title-border: #343434;
    --window-radius: 2px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03),
      0 18px 50px rgba(0,0,0,0.65);
  }

  .terminal-window.windows-theme .title-bar {
    padding: 8px 10px 8px 12px;
    min-height: 34px;
  }

  .terminal-window.windows-theme .dot { display: none; }

  .terminal-window.windows-theme .title-bar::before {
    content: '▣';
    color: #cfcfcf;
    font-size: 13px;
    margin-right: 2px;
  }

  .terminal-window.windows-theme .title-bar span.name {
    margin-left: 0;
    color: #d7d7d7;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0;
  }

  .windows-controls {
    display: none;
  }

  .terminal-window.windows-theme .windows-controls {
    margin-left: 8px;
    display: flex;
    align-items: center;
    align-self: stretch;
  }

  .windows-controls button,
  .windows-controls a {
    width: 40px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #d5d5d5;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 13px;
    cursor: default;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .windows-controls .close { font-size: 15px; cursor: pointer; }

  .terminal-window.windows-theme .windows-controls .close:hover {
    background: #c42b1c;
    color: white;
  }

  .terminal-window.windows-theme .windows-controls button:not(.close):hover {
    background: #353535;
  }

  .terminal-window.windows-theme .banner {
    font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
    text-shadow: none;
  }

  .terminal-window.windows-theme select,
  .terminal-window.windows-theme button.flashcard-btn,
  .terminal-window.windows-theme .output-panel {
    border-radius: 2px;
  }

  .terminal-window.windows-theme button.flashcard-btn {
    color: #d8d8d8;
    border-color: #666;
  }

  .terminal-window.windows-theme button.flashcard-btn:hover {
    background: rgba(255,255,255,0.05);
    box-shadow: none;
  }

  /* ---------- body ---------- */
  .terminal-body {
    padding: 22px 24px 26px;
    min-height: 360px;
  }

  .banner {
    font-family: 'VT323', monospace;
    font-size: 30px;
    line-height: 1.1;
    color: var(--green-bright);
    text-shadow: 0 0 12px rgba(79,251,134,0.35);
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }

  .subhead {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 22px;
  }

  /* boot sequence */
  #boot {
    font-size: 13px;
    line-height: 1.9;
    min-height: 360px;
  }
  #boot .boot-line { opacity: 0; animation: bootIn 0.15s ease-out forwards; }
  #boot .boot-line.dim { color: var(--green-dim); }
  @keyframes bootIn { to { opacity: 1; } }

  #main { display: none; }
  #main.visible { display: block; animation: bootIn 0.3s ease-out; }

  /* ---------- prompt rows ---------- */
  .prompt-row {
    margin-bottom: 18px;
  }

  .prompt-row.hidden { display: none; }

  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--green-dim);
    margin-bottom: 6px;
  }

  label::before {
    content: "> ";
    color: var(--amber);
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--bg-inset);
    color: var(--green-bright);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 34px 10px 12px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--green-dim) 50%),
                       linear-gradient(135deg, var(--green-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    transition: border-color 0.15s ease;
  }

  select:hover { border-color: var(--green-dim); }

  select:focus-visible, button:focus-visible {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(79, 251, 134, 0.25);
  }

  option { background: var(--bg-inset); color: var(--green-bright); }

  /* ---------- actions ---------- */
  .actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px 0 20px;
    flex-wrap: wrap;
  }

  button.flashcard-btn {
    background: transparent;
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 4px;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  button.flashcard-btn:hover {
    background: rgba(255, 180, 84, 0.1);
    box-shadow: 0 0 16px rgba(255, 180, 84, 0.25);
  }

  button.flashcard-btn:active { transform: translateY(1px); }

  .hint {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ---------- output ---------- */
  .output-panel {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
    min-height: 120px;
  }

  .output-empty {
    color: var(--text-muted);
    font-size: 13px;
  }

  .output-cat {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--green-dim);
    margin-bottom: 8px;
  }

  .output-label {
    font-size: 15px;
    color: var(--green-bright);
    margin-bottom: 12px;
    font-weight: 700;
  }

  .output-label::before { content: "$ "; color: var(--amber); }

  pre.output-value {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--green);
  }

  pre.output-value big {
    font-size: 1.25em;
    line-height: 1.3;
  }

  .line-reveal {
    opacity: 0;
    display: block;
    animation: revealLine 0.18s ease-out forwards;
  }

  /* tighter spacing for table-like rows (lines containing "|") */
  .line-tight {
    line-height: 1.15;
  }

  .line-spacer {
    line-height: 0.8;
  }

  @keyframes revealLine {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .line-reveal { animation: none; opacity: 1; }
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--green);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 480px) {
    body {
      align-items: flex-start;
      padding-top: max(18px, env(safe-area-inset-top));
      padding-bottom: max(18px, env(safe-area-inset-bottom));
    }

    .banner { font-size: 24px; }
    .terminal-body { padding: 18px 16px 20px; }

    select,
    button.flashcard-btn {
      min-height: 44px;
    }

    .theme-toggle {
      min-height: 32px;
      padding: 5px 8px;
    }

    .output-panel {
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
  
  @media (max-width: 480px) {
      pre.output-value {
          width: 100%;
          min-width: 0;
          font-size: 11px;
          line-height: 1.45;
          white-space: pre-wrap;
          overflow-wrap: anywhere;
          word-break: normal;
      }
  
      .line-tight {
          line-height: 1.2;
      }
  }

    .windows-controls button,
    .windows-controls a {
      width: 34px;
    }
  }
</style>
</head>
<body>

<div class="crt">
  <div class="terminal-window">
    <div class="title-bar">
      <a class="dot red close-site" href="/" aria-label="Back to main site" title="Back to main site"></a>
      <div class="dot amber"></div>
      <div class="dot"></div>
      <span class="name">terminology.db</span>

      <button class="theme-toggle" id="theme-toggle" type="button"
              aria-label="Switch terminal theme" title="Switch terminal theme">
        <span class="theme-icon">▣</span>
        <span id="theme-toggle-label">WIN</span>
      </button>

      <div class="windows-controls" aria-hidden="true">
        <button type="button" aria-label="Minimize">−</button>
        <button type="button" aria-label="Maximize">□</button>
        <a class="close close-site" href="/" aria-label="Back to main site" title="Back to main site">×</a>
      </div>
    </div>

    <div class="terminal-body">

      <div id="boot"></div>

      <div id="main">
        <p class="banner">TERMINOLOGY REFERENCE</p>
        <p class="subhead">select an area, then a term</p>

        <div class="prompt-row" id="row-area">
          <label for="area-select">terminology area</label>
          <select id="area-select">
            <option value="" disabled selected>-- choose an area --</option>
          </select>
        </div>

        <div class="prompt-row hidden" id="row-term">
          <label for="term-select">term</label>
          <select id="term-select">
            <option value="" disabled selected>-- choose a term --</option>
          </select>
        </div>

        <div class="actions">
          <button class="flashcard-btn" id="flashcard-btn" type="button">[ FLASHCARD ]</button>
          <span class="hint">pulls a random term from any area</span>
        </div>

        <div class="output-panel" id="output">
          <p class="output-empty">// no term selected yet</p>
        </div>
      </div>

    </div>
  </div>
</div>

          label: 'p-value',
          value: `A p-value (probability value) measures how likely it is that you got your test results \
by random chance. It assumes that a baseline idea called the null hypothesis (which says there is no real \
effect or difference) is true. A lower p-value means your data is very unusual under that baseline idea, \
giving you stronger evidence to reject it. 

<big><b>Core Concepts</big></b>

<b>Definition:</b> The chance of seeing results as extreme as yours if nothing real is happening.
<b>Alpha level (\u03b1):</b> Your cutoff line for surprise. Most fields use 0.05 (5% chance) as the standard threshold.
<b>Statistical significance:</b> When your p-value is lower than your alpha level (e.g., p < 0.05), you reject the baseline idea. 

<big><b>Common Misconceptions</big></b>

• It is not the probability that your test result happened by pure random luck.
• It is not the chance that the null hypothesis is true.
• A high p-value (> 0.05) does not prove the baseline idea is correct; it just means you do not have enough \

        cartesian_doubt: {
          label: 'Cartesian doubt',
          value: `Cartesian doubt is a systematic, methodological skepticism created by René Descartes to strip \
away false beliefs and find absolute, indubitable truth. By treating any belief with a shadow of doubt as completely \
false, Descartes used it as a foundational tool to rebuild reliable knowledge.

<big><b>The Three Waves of Doubt</b></big>

Descartes tested his beliefs through escalating levels of skepticism: 
<b>• Sensory Illusion:</b> Our senses can deceive us about small or distant things, so we cannot trust them completely. 
<b>• The Dream Argument:</b> We can feel vivid sensations while dreaming, making it hard to prove we are not asleep right now. 
<b>• The Evil Demon:</b> A malicious, all-powerful deceiver could trick our minds into believing false logical and mathematical truths.

<b><big>The Turning Point and the Cogito</b></big>

Even if an evil demon tricks everything, Descartes realized that someone must be there to be tricked. This led \
to his famous breakthrough: <b>"Cogito, ergo sum"</b> ("I think, therefore I am"). The mere act of thinking and \
doubting proves the existence of a thinking self. 

<b><big>Purpose and Legacy</b></big>

<b>• Foundationalism:</b> It acts like emptying a basket of apples to throw out the rotten ones and keep only the good. 
<b>• Scientific Impact:</b> It helped launch modern science by encouraging researchers to question assumptions and test evidence. 
<b>• Modern Relevance:</b> It serves as a mental shield against online misinformation, deepfakes, and bad data.

        right_left_hand: {
          label: 'RHP & LHP',
          value: `The Right-Hand Path (RHP) and Left-Hand Path (LHP) are two opposing philosophies in esotericism, \
occultism, and religion. The RHP focuses on unity with a higher power, community, and moral rules. The LHP focuses \
on individualism, self-deification, and breaking societal taboos 

<big><b>Core Philosophical Differences</big></b>

<u><b>Ultimate Goal:</b></u>

<u><b>Authority and Rules:</b></u>

<u><b>Community vs. Self:</b></u>

can also demand rigid conformity or suppression of personal identity.
<b>Left-Hand Path:</b> Widely mischaracterized as malicious <i>"black magic"</i> or evil. In practice, many LHP adherents \
view it as a psychological and spiritual toolkit for radical self-honesty, shadow work, and personal \
independence rather than harm. 

<big><b>Historical Origins</big></b>

and <i>Vamachara</i> for the Left-Hand Path), where the left path utilized unorthodox or taboo rituals for rapid \

like Thelema, Luciferianism, and Satanism to categorize their magical workings and worldviews.`

  // ---------------------------------------------------------------
  // BOOT SEQUENCE
  // ---------------------------------------------------------------
  const bootLines = [
    { text: 'booting terminology.db ...', dim: false },
    { text: 'mounting reference tables ...', dim: true },
    { text: 'loading category index ...', dim: true },
    { text: 'ready.', dim: false }
  ];

  const bootEl = document.getElementById('boot');
  const mainEl = document.getElementById('main');

  function runBoot() {
    bootLines.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'boot-line' + (line.dim ? ' dim' : '');
      div.textContent = line.text;
      div.style.animationDelay = (i * 220) + 'ms';
      bootEl.appendChild(div);
    });

    const totalDelay = bootLines.length * 220 + 350;
    setTimeout(() => {
      bootEl.style.display = 'none';
      mainEl.classList.add('visible');
    }, totalDelay);
  }

  // ---------------------------------------------------------------
  // DROPDOWN POPULATION
  // ---------------------------------------------------------------
  const areaSelect = document.getElementById('area-select');
  const termSelect = document.getElementById('term-select');
  const rowTerm = document.getElementById('row-term');
  const outputPanel = document.getElementById('output');
  const terminalWindow = document.querySelector('.terminal-window');
  const themeToggle = document.getElementById('theme-toggle');
  const themeToggleLabel = document.getElementById('theme-toggle-label');

  function applyTheme(theme) {
    const isWindows = theme === 'windows';
    terminalWindow.classList.toggle('windows-theme', isWindows);
    themeToggleLabel.textContent = isWindows ? 'MAC' : 'WIN';
    themeToggle.setAttribute(
      'aria-label',
      isWindows ? 'Switch to macOS theme' : 'Switch to Windows theme'
    );
    themeToggle.title = isWindows ? 'Switch to macOS theme' : 'Switch to Windows theme';

    const themeColor = document.querySelector('meta[name="theme-color"]');
    if (themeColor) {
      themeColor.setAttribute('content', isWindows ? '#111111' : '#070b08');
    }
    try {
      localStorage.setItem('terminology-theme', theme);
    } catch (e) {
      // Local file viewers may block localStorage.
    }
  }

  themeToggle.addEventListener('click', () => {
    const nextTheme = terminalWindow.classList.contains('windows-theme')
      ? 'mac'
      : 'windows';
    applyTheme(nextTheme);
  });

  let savedTheme = 'mac';

  try {
    savedTheme = localStorage.getItem('terminology-theme') || 'mac';
  } catch (e) {
    // Local HTML viewers may not provide persistent storage.
  }
  applyTheme(savedTheme);

  function populateAreas() {
    Object.keys(terminologyDict).forEach(catKey => {
      const opt = document.createElement('option');
      opt.value = catKey;
      opt.textContent = terminologyDict[catKey].catLabel;
      areaSelect.appendChild(opt);
    });
  }

  function populateTerms(catKey) {
    termSelect.innerHTML = '<option value="" disabled selected>-- choose a term --</option>';
    const terms = terminologyDict[catKey].terms;
    Object.keys(terms)
      .sort((a, b) => a.localeCompare(b))
      .forEach(termKey => {
        const opt = document.createElement('option');
        opt.value = termKey;
        opt.textContent = terms[termKey].label;
        termSelect.appendChild(opt);
      });
  }

  // Escapes a line of text, then re-enables a small whitelist of inline
  // formatting tags: <b>, <strong>, <u>, <i>, <em>, <big> (no attributes allowed).
  const ALLOWED_INLINE_TAGS = /&lt;(\/?)(b|strong|u|i|em|big)&gt;/gi;
  function formatInline(text) {
    const escaped = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
    return escaped.replace(ALLOWED_INLINE_TAGS, (m, slash, tag) => `<${slash}${tag.toLowerCase()}>`);
  }

  function renderTerm(catKey, termKey) {
    const cat = terminologyDict[catKey];
    const term = cat.terms[termKey];

    outputPanel.innerHTML = '';

    const catTag = document.createElement('div');
    catTag.className = 'output-cat';
    catTag.textContent = cat.catLabel;
    outputPanel.appendChild(catTag);

    const labelEl = document.createElement('div');
    labelEl.className = 'output-label';
    labelEl.textContent = term.label;
    outputPanel.appendChild(labelEl);

    const pre = document.createElement('pre');
    pre.className = 'output-value';
    outputPanel.appendChild(pre);

    const lines = term.value.split('\n');
    lines.forEach((line, i) => {
      const span = document.createElement('span');

      span.className = 'line-reveal';

      // Lines that look like table rows (contain "|") get tighter spacing.
      if (line.includes('|')) {
        span.classList.add('line-tight');
      }

      // Empty lines are intentional visual spacers.
      if (!line.length) {
        span.classList.add('line-spacer');
      }

      span.style.animationDelay = (i * 35) + 'ms';
      if (line.length) {
        span.innerHTML = formatInline(line);
      } else {
        span.textContent = '\u00A0';
      }
      pre.appendChild(span);
    });

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    pre.appendChild(cursor);
  }

  // ---------------------------------------------------------------
  // EVENTS
  // ---------------------------------------------------------------
  areaSelect.addEventListener('change', () => {
    const catKey = areaSelect.value;
    populateTerms(catKey);
    rowTerm.classList.remove('hidden');
    outputPanel.innerHTML = '<p class="output-empty">// choose a term from the list above</p>';
  });

  termSelect.addEventListener('change', () => {
    const catKey = areaSelect.value;
    const termKey = termSelect.value;
    if (catKey && termKey) renderTerm(catKey, termKey);
  });

  document.getElementById('flashcard-btn').addEventListener('click', () => {
    const catKeys = Object.keys(terminologyDict);
    const randCatKey = catKeys[Math.floor(Math.random() * catKeys.length)];
    const termKeys = Object.keys(terminologyDict[randCatKey].terms);
    const randTermKey = termKeys[Math.floor(Math.random() * termKeys.length)];

    areaSelect.value = randCatKey;
    populateTerms(randCatKey);
    termSelect.value = randTermKey;
    rowTerm.classList.remove('hidden');

    renderTerm(randCatKey, randTermKey);
  });

  // ---------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------
  runBoot();
  populateAreas();
</script>
